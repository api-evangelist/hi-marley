aid: hi-marley
name: Hi Marley
description: 'Hi Marley is an intelligent conversational platform built for the property
  and casualty (P&C) insurance industry, delivering carrier-to-policyholder communication
  over SMS. The platform connects carriers, policyholders, and service providers through
  a single messaging fabric to streamline claims — including Conversational FNOL (First
  Notice of Loss) intake, Total Loss Assist for auto claims, and Workflow Assist for
  property claims — layered with AI coaching, sentiment analysis, and data insights.
  Trusted by 130+ carriers, including four of the top ten U.S. insurers across auto,
  property, and workers compensation lines. Hi Marley is backed by Emergence Capital
  and True Ventures. No public developer platform, API documentation, or self-service
  onboarding was found; the product is delivered as a closed SaaS to insurance carriers.'
